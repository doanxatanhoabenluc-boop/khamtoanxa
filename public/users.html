<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h3 class="mb-4">
        <i class="fa-solid fa-users"></i>
        Quản lý tài khoản
    </h3>

    <!-- FORM THÊM MỚI -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-3">
                    <input id="username" class="form-control" placeholder="Tên đăng nhập">
                </div>
                <div class="col-md-3">
                    <input id="fullname" class="form-control" placeholder="Họ tên">
                </div>
                <div class="col-md-2">
                    <input id="password" class="form-control" placeholder="Mật khẩu">
                </div>
                <div class="col-md-2">
                    <select id="role" class="form-select">
                        <option value="member">Member</option>
                        <option value="lanh_dao">Lãnh đạo</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button id="btnAdd" class="btn btn-success w-100">
                        <i class="fa-solid fa-plus"></i> Thêm
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BẢNG DANH SÁCH -->
    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-bordered mb-0 align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Tài khoản</th>
                    <th>Họ tên</th>
                    <th>Quyền</th>
                    <th>Trạng thái</th>
                    <th width="320">Thao tác</th>
                </tr>
            </thead>
            <tbody id="tableUsers">
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL SỬA THÔNG TIN USER -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fa-solid fa-user-pen"></i> Chỉnh sửa tài khoản</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Tài khoản</label>
                    <input type="text" id="editUsername" class="form-control" disabled readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Họ và tên</label>
                    <input type="text" id="editFullname" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Phân quyền</label>
                    <select id="editRole" class="form-select">
                        <option value="member">Member</option>
                        <option value="lanh_dao">Lãnh đạo</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-primary" onclick="saveEditUser()">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="users.js"></script>
</body>
</html>
