<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quản lý tài khoản</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4">

<h3 class="mb-4">

<i class="fa-solid fa-users"></i>

Quản lý tài khoản

</h3>

<div class="card mb-4">

<div class="card-body">

<div class="row g-2">

<div class="col-md-3">

<input
id="username"
class="form-control"
placeholder="Tên đăng nhập">

</div>

<div class="col-md-3">

<input
id="fullname"
class="form-control"
placeholder="Họ tên">

</div>

<div class="col-md-2">

<input
id="password"
class="form-control"
placeholder="Mật khẩu">

</div>

<div class="col-md-2">

<select
id="role"
class="form-select">

<option value="member">

Member

</option>

<option value="admin">

Admin

</option>

</select>

</div>

<div class="col-md-2">

<button
id="btnAdd"
class="btn btn-success w-100">

Thêm

</button>

</div>

</div>

</div>

</div>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Tài khoản</th>

<th>Họ tên</th>

<th>Quyền</th>

<th>Trạng thái</th>

<th width="300">

Thao tác

</th>

</tr>

</thead>

<tbody id="tableUsers">

</tbody>

</table>

</div>

<script src="users.js"></script>

</body>

</html>
