<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-box">

    <h2>KHÁM TOÀN XÃ</h2>

    <input
        id="username"
        placeholder="Tên đăng nhập"
    >

    <input
        id="password"
        type="password"
        placeholder="Mật khẩu"
    >

    <button id="btnLogin">
        Đăng nhập
    </button>

    <p id="msg"></p>

</div>

<script src="login.js"></script>

</body>

</html>
